name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: ci
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Publish mx20022-model
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=mx20022-model
          if curl -sf "https://index.crates.io/mx/20/$crate" | grep -q "\"vers\":\"$VERSION\""; then
            echo "::notice::$crate $VERSION already published — skipping"
          else
            cargo publish -p "$crate" --all-features
          fi

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mx20022-codegen
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=mx20022-codegen
          if curl -sf "https://index.crates.io/mx/20/$crate" | grep -q "\"vers\":\"$VERSION\""; then
            echo "::notice::$crate $VERSION already published — skipping"
          else
            cargo publish -p "$crate"
          fi

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mx20022-parse
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=mx20022-parse
          if curl -sf "https://index.crates.io/mx/20/$crate" | grep -q "\"vers\":\"$VERSION\""; then
            echo "::notice::$crate $VERSION already published — skipping"
          else
            cargo publish -p "$crate" --all-features
          fi

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mx20022-validate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=mx20022-validate
          if curl -sf "https://index.crates.io/mx/20/$crate" | grep -q "\"vers\":\"$VERSION\""; then
            echo "::notice::$crate $VERSION already published — skipping"
          else
            cargo publish -p "$crate" --all-features
          fi

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mx20022-translate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=mx20022-translate
          if curl -sf "https://index.crates.io/mx/20/$crate" | grep -q "\"vers\":\"$VERSION\""; then
            echo "::notice::$crate $VERSION already published — skipping"
          else
            cargo publish -p "$crate" --all-features
          fi

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mx20022-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=mx20022-cli
          if curl -sf "https://index.crates.io/mx/20/$crate" | grep -q "\"vers\":\"$VERSION\""; then
            echo "::notice::$crate $VERSION already published — skipping"
          else
            cargo publish -p "$crate" --all-features
          fi

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish mx20022 (umbrella)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          crate=mx20022
          if curl -sf "https://index.crates.io/mx/20/$crate" | grep -q "\"vers\":\"$VERSION\""; then
            echo "::notice::$crate $VERSION already published — skipping"
          else
            cargo publish -p "$crate" --all-features
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
