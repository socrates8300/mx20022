version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    # No ignore rules: the previous MSRV 1.79 caps on clap, criterion, and
    # indexmap are satisfied by the current MSRV 1.86 (clap 4.6 needs 1.85,
    # indexmap 2.12 needs 1.82, criterion 0.6 needs 1.80). The "Check (1.86.0)"
    # CI lane validates every proposed bump against the declared MSRV.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
